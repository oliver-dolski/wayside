# CI for Wayside.
#
# The project's target platform is Windows 11 with Windows PowerShell 5.1, so both jobs
# below run on `windows-latest` - not out of preference, but because a test suite green
# only on Linux would not prove FOUND-02 ("they pass on a clean clone", not "they pass on
# the author's machine"). The steps use an explicit `shell: pwsh` (PowerShell Core),
# because that is the default shell of the `windows-latest` runner and GitHub Actions
# automatically adds `$ErrorActionPreference = 'stop'` to it along with propagation of
# `$LASTEXITCODE` as the step status - one shell choice across the whole file, to avoid
# runs that "work locally" under a shell other than the one used in CI.
#
# AN ARCHITECTURAL BOUNDARY, NOT AN OVERSIGHT: the `confidentiality-backstop` job DOES
# NOT and MUST NOT have access to the local corpus of standards `standards/.local/` - the
# directory is gitignored and never reaches the remote repository (see FOUND-04). The
# backstop runs only the structural layer (`--no-corpus`) of the confidentiality gate plus
# the path check across the whole history. Trying to "fix" that by uploading the corpus to
# the repository secrets would defeat the purpose of the entire gate: a corpus that stays
# on one machine is a control, not an inconvenience. This backstop is DETECTIVE by nature,
# not PREVENTIVE - GitHub.com gives personal accounts no server-side pre-receive hooks, so
# a red status confirms a violation AFTER the fact (after `git push`) rather than
# preventing the content from being sent at all. The boundaries are described in README.md
# under "## Verification in CI".

name: ci

# The quotes around "on" are deliberate: without them PyYAML (YAML 1.1) parses this
# bareword as the bool `True`, not the string "on" - `tests/test_ci_workflow_contract.py`
# would then read the key `True` instead of "on". GitHub Actions accepts both forms
# identically.
"on":
  push:
  pull_request:

jobs:
  test:
    name: Full test suite (fresh checkout)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # An exact patch tag, NOT `@v10`. `astral-sh/setup-uv` stopped publishing
        # a moving major-version tag as of v8: the repository has `v7.4`, `v7.5`,
        # `v7.6`, but for v8, v9 and v10 only exact patch tags exist. `@v10` does
        # not exist as a ref (the API returns 404), so `Set up job` falls over
        # after three seconds with `Unable to resolve action`. Confirmed by the
        # first real CI run (run 33621915010, 2026-09-02). `actions/checkout@v7`
        # stays on the major tag, because there the moving tag is published - this
        # is not an inconsistency, it is two different tagging policies at two
        # different vendors.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync the environment (--locked)
        shell: pwsh
        run: uv sync --locked

      - name: Test collection completeness gate
        shell: pwsh
        run: |
          # `uv run pytest` already exits with a non-zero code when zero tests are
          # collected, but it does not notice the case where one particular gating
          # module dropped out of the collection (say through an import error
          # silenced by the configuration, or a change to `testpaths`) while the
          # rest of the suite keeps growing. This step checks the presence of the
          # five critical phase 1 modules outright, instead of relying on a
          # numeric test-count threshold (which would either be set so low as to
          # be useless, or would falsify runs as the suite grows through later
          # phases).
          $collected = uv run pytest --collect-only -q 2>&1 | Out-String
          Write-Host $collected

          # NOTE (Z-101, plan 05-04): the module testing the three-surface audit of
          # the whole history (the `slow` marker, skipped by default through the
          # filter in pyproject.toml) is deliberately NOT on this list. Once the
          # default marker filter was introduced, that module no longer appears in
          # the collection below (which inherits the default options), so adding it
          # here would turn this step red immediately. Its presence in CI is guarded
          # by a SEPARATE workflow contract test (the history audit test file in the
          # tests/ directory), which checks that the confidentiality-backstop job
          # calls it with the `slow` marker explicitly enabled.
          $criticalModules = @(
            'test_confidentiality_guard_integration',
            'test_no_history_leak',
            'test_fixture_manifest',
            'test_no_external_dissector',
            'test_check_pub_gate'
          )

          $missing = @()
          foreach ($moduleName in $criticalModules) {
            if ($collected -notmatch [regex]::Escape($moduleName)) {
              $missing += $moduleName
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Gating module(s) vanished from the test collection: $($missing -join ', ')"
            exit 1
          }

          Write-Host "All five critical phase 1 modules present in the collection."

      - name: Run the test suite
        shell: pwsh
        run: uv run pytest

  confidentiality-backstop:
    name: Confidentiality backstop (detective)
    runs-on: windows-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # Without this, `git log --all` in the step below sees only a shallow
          # history (1 commit by default) and the history gate would look green
          # despite never having checked the repository history at all.
          fetch-depth: 0

      - name: Install uv
        # An exact patch tag, NOT `@v10`. `astral-sh/setup-uv` stopped publishing
        # a moving major-version tag as of v8: the repository has `v7.4`, `v7.5`,
        # `v7.6`, but for v8, v9 and v10 only exact patch tags exist. `@v10` does
        # not exist as a ref (the API returns 404), so `Set up job` falls over
        # after three seconds with `Unable to resolve action`. Confirmed by the
        # first real CI run (run 33621915010, 2026-09-02). `actions/checkout@v7`
        # stays on the major tag, because there the moving tag is published - this
        # is not an inconsistency, it is two different tagging policies at two
        # different vendors.
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync the environment (--locked)
        shell: pwsh
        run: uv sync --locked

      - name: Confidentiality gate - structural layer (no corpus)
        shell: pwsh
        run: |
          # `scripts/confidentiality_guard.py` uses the standard library only, so
          # it runs here without extra dependencies. The `--no-corpus` flag is
          # mandatory in CI - see the comment at the top of this file about the
          # architectural boundary.
          $trackedFiles = git ls-files
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git ls-files exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          uv run python scripts/confidentiality_guard.py --no-corpus @trackedFiles

      - name: Confidentiality gate - empty standards/.local history
        shell: pwsh
        run: |
          # The oracle from Pattern 3 of the phase 1 research: if this command ever
          # returns a commit, it is not a scenario to be fixed by another commit -
          # the content is already in the history and requires `git filter-repo`
          # (or BFG Repo-Cleaner) plus a force push before any public push.
          $history = git log --all -- standards/.local
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git log --all exited with code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          if ($history) {
            Write-Error "The standards/.local directory has entries in the git history - git filter-repo is required before a public push."
            exit 1
          }

          Write-Host "The standards/.local history is empty."

      - name: Three-surface audit of the whole history (PUB-05, slow marker)
        shell: pwsh
        run: |
          # The ONLY place in the whole repository where the `slow` marker is
          # explicitly enabled - see the comment next to `addopts` in pyproject.toml
          # (D-22: registering the marker skips nothing, the filter in addopts skips
          # by default, this line explicitly overrides it). This job has a checkout
          # with the full history (`fetch-depth: 0` above) - without it this scan
          # would look green without having checked the history at all.
          uv run pytest -o addopts="-q" -m slow tests/test_history_audit.py
