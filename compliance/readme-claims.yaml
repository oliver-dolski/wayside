# The README claim catalogue (PUB-04, D-14, D-15, D-16, D-17).
#
# This file is an INVENTORY of the claims made in the README together with the
# evidence for each of them - it is NOT a wish list and NOT a plan. Every entry
# names a test in its `evidence` field, which the `tests/test_readme_claims.py`
# gate checks against the `pytest --collect-only` collection. An entry without
# evidence has no right to stand here.
#
# Manual evidence (`evidence: manual`) is admissible ONLY with a non-empty
# `reason` field, checked by machine. The reason for admitting it: some true
# README sentences are claims about the runtime environment rather than about
# the code (e.g. "Wireshark, tshark and Npcap are not needed") - forbidding
# manual evidence would force either cutting a true sentence or writing a
# sham test.
entries:
  - id: passive-no-network-imports
    claim: >-
      The tool never sends a packet to the network - under src/wayside there
      is not a single import of a networking module.
    readme_anchor: Intended Use
    evidence: "tests/test_oui.py::test_no_network_module_imports_under_src_wayside"
    status: active

  # --- ## Getting started ----------------------------------------------------

  - id: bootstrap-no-npcap-needed
    claim: >-
      Wireshark, tshark and a capture driver (Npcap) are not needed to work
      with the tool - every read happens from a capture file.
    readme_anchor: Getting started
    evidence: manual
    reason: >-
      A claim about the user's runtime environment (the absence of a
      dependency on third-party tools), not about the code, so no test in
      this repository can carry it. The read path is nonetheless covered by
      a real run rather than by an assertion: the full suite passes on the
      windows-latest CI runner, a machine where scapy reports no libpcap
      provider (run 34468269392), which is what the absence of a capture
      driver looks like from inside the process. What stays unproven is the
      bootstrap script itself, because CI builds the environment with
      uv sync --locked instead of running it.
    status: active

  - id: bootstrap-path-refresh
    claim: >-
      The bootstrap.ps1 script refreshes the PATH of the current process from
      the registry between installing uv through winget and re-checking that
      it is present, so that one run after cloning suffices even when uv has
      to be installed first.
    readme_anchor: Getting started
    evidence: "tests/test_bootstrap_smoke.py::test_bootstrap_refreshes_path_between_winget_install_and_recheck"
    status: active

  - id: bootstrap-hooks-unset-before-install
    claim: >-
      The bootstrap.ps1 script unsets a locally configured core.hooksPath
      before installing the pre-commit hook, when one is set.
    readme_anchor: Getting started
    evidence: "tests/test_bootstrap_smoke.py::test_bootstrap_unsets_local_hooks_path_before_install"
    status: active

  - id: bootstrap-hooks-restore-after-failed-install
    claim: >-
      The bootstrap.ps1 script restores the core.hooksPath it unset even when
      the pre-commit hook installation fails, which keeps a second run of the
      script idempotent.
    readme_anchor: Getting started
    evidence: "tests/test_bootstrap_smoke.py::test_bootstrap_restores_local_hooks_path_even_when_install_failed"
    status: active

  # --- ## Confidentiality gate ------------------------------------------------

  - id: confidentiality-path-layer-blocks-forced-add
    claim: >-
      The path layer of the confidentiality gate rejects every file under
      standards/.local/ at commit time, regardless of content, even when it
      was added with git add -f.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard_integration.py::test_commit_with_standards_local_file_added_with_force_is_rejected"
    status: active

  - id: confidentiality-structural-layer-blocks-normative-clause
    claim: >-
      The structural layer of the confidentiality gate rejects a commit
      carrying a sentence shaped like a normative clause (a dotted clause
      number with a normative modal term on the same line), with no access to
      the local standards corpus.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard_integration.py::test_commit_with_forbidden_normative_sentence_is_rejected"
    status: active

  - id: confidentiality-corpus-layer-blocks-shingle-match
    claim: >-
      The corpus layer of the confidentiality gate detects content
      overlapping with the local standards/.local directory through
      twelve-word shingles, working locally only, where that directory can
      exist.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard.py::test_corpus_layer_flags_matching_twelve_word_shingle"
    status: active

  - id: confidentiality-identity-layer-blocks-project-name-outside-exempted-path
    claim: >-
      The identity layer of the confidentiality gate rejects a commit
      carrying the proper name of a project fenced off by the author's
      confidentiality boundary, outside the paths explicitly exempted from
      that rule.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard_integration.py::test_commit_with_project_name_outside_exempted_path_is_rejected"
    status: active

  - id: confidentiality-identity-layer-shape-rules-are-public-abbreviations
    claim: >-
      The four shape rules of the identity layer (RFC 1918 private
      addressing, a hardware address, a device name, a proper name) are built
      from publicly known industry abbreviations and addressing shapes, work
      with no local material, and therefore work in CI too.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard.py::test_device_role_prefixes_are_closed_set_of_uppercase_abbreviations"
    status: active

  - id: confidentiality-identity-layer-declared-address-required
    claim: >-
      An address shaped like private addressing or like a hardware address
      present in the tracked tree has to be declared by value together with
      its origin in .confidentiality-allow - an undeclared address fires the
      gate regardless of the file it sits in.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard.py::test_every_identity_address_match_in_tracked_tree_is_declared_or_exempted"
    status: active

  - id: confidentiality-identity-layer-fifth-rule-local-only
    claim: >-
      The fifth rule of the identity layer, the literal one, works LOCALLY
      ONLY from a gitignored file, and its absence is reported as a warning
      on standard error, never passed over in silence.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard.py::test_load_identity_local_literals_missing_file_warns_and_returns_empty"
    status: active

  - id: confidentiality-identity-layer-does-not-cover-binary-files-itself
    claim: >-
      The gate script itself reads text content only and does not cover
      binary files - the text layer of declared binary files tracked by git
      is searched with the identity patterns by a separate test in the suite.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_confidentiality_guard.py::test_declared_binary_files_text_layer_carries_no_undeclared_identity_match"
    status: active

  - id: confidentiality-remediation-contract-covers-every-pattern
    claim: >-
      A hit in the repository history requires a history rewrite with git
      filter-repo before any public push, for every pattern of the gate, not
      only for the standards/.local path.
    readme_anchor: Confidentiality gate
    evidence: "tests/test_no_history_leak.py::test_standards_local_never_appears_in_commit_history"
    status: active

  # --- ## Usage ---------------------------------------------------------------

  - id: analyze-writes-two-artifacts-without-pdf
    claim: >-
      The `wayside analyze` command without the --pdf flag writes exactly two
      artifacts into the output directory: analysis.json and report.md, with
      no report.pdf.
    readme_anchor: Usage
    evidence: "tests/test_report_pdf.py::test_analyze_without_pdf_flag_writes_two_artifacts_and_no_pdf"
    status: active

  - id: analyze-pdf-flag-writes-third-artifact
    claim: >-
      The --pdf flag adds a third artifact, report.pdf, and exits with code 0.
    readme_anchor: Usage
    evidence: "tests/test_report_pdf.py::test_analyze_with_pdf_flag_writes_three_artifacts_and_exits_zero"
    status: active

  - id: pdf-embeds-unicode-font-for-non-ascii
    claim: >-
      The PDF export embeds a Unicode font (DejaVu Sans), so that characters
      outside ASCII are present in the text layer of the PDF as single,
      composed code points, regardless of the fonts installed on the system.
    readme_anchor: Usage
    evidence: "tests/test_report_pdf.py::test_text_layer_carries_all_nine_polish_diacritics_as_single_codepoints"
    status: active

  - id: pdf-flag-disabled-by-default-no-new-runtime-dependency
    claim: >-
      The --pdf flag is off by default: the tool's default path (analyze
      without --pdf) does not import the fpdf library and does not gain a new
      runtime dependency because of it.
    readme_anchor: Usage
    evidence: "tests/test_report_pdf.py::test_pdf_library_not_imported_by_default_analyze_run"
    status: active

  # --- ## Example report ------------------------------------------------------

  - id: example-report-reproducible-from-slice
    claim: >-
      The example report in examples/4sics/ is byte-reproducible from the
      script fetching a slice of the 4SICS dataset - no capture file from
      that dataset is tracked by git.
    readme_anchor: Example report
    evidence: "tests/test_example_report.py::test_example_artifacts_are_byte_reproducible_from_slice"
    status: active

  # --- ## Citation verification status ----------------------------------------

  - id: standards-verification-section-present
    claim: >-
      The README carries a `## Citation verification status` section
      describing the verification status of normative clause numbering.
    readme_anchor: Citation verification status
    evidence: "tests/test_standard_designation_gate.py::test_readme_has_standard_verification_section_header"
    status: active

  - id: standards-verification-section-carries-marker
    claim: >-
      The citation verification section carries the marker `verified: no` for
      citations to IEC 62443-3-3 whose numbering has not been collated
      against a legal copy of the standard.
    readme_anchor: Citation verification status
    evidence: "tests/test_standard_designation_gate.py::test_readme_verification_section_carries_verification_marker"
    status: active

  - id: standards-verification-links-decision-records
    claim: >-
      The citation verification section links to both decision records (0004
      and 0006), which describe the path to resolving the CLC/TS 50701
      designation and the verification of IEC 62443-3-3 numbering.
    readme_anchor: Citation verification status
    evidence: "tests/test_standard_designation_gate.py::test_readme_verification_section_links_both_decision_records"
    status: active

  - id: standards-railway-catalog-edition
    claim: >-
      Every standards catalogue entry with a CLC/TS designation carries the
      2023 edition, in line with the decision record on the CLC/TS 50701:2023
      designation.
    readme_anchor: Citation verification status
    evidence: "tests/test_standard_designation_gate.py::test_every_railway_catalog_entry_has_expected_edition"
    status: active

  # --- ## Verification in CI ---------------------------------------------------

  - id: ci-job-test-syncs-and-runs-pytest
    claim: >-
      The `test` job in CI syncs the environment with `uv sync --locked` and
      runs the full test suite with `uv run pytest` on a fresh checkout.
    readme_anchor: Verification in CI
    evidence: "tests/test_ci_workflow_contract.py::test_job_test_syncs_locked_and_runs_pytest"
    status: active

  - id: ci-backstop-full-history-checkout
    claim: >-
      The `confidentiality-backstop` job checks out with full history
      (fetch-depth: 0), so that the history scan can cover every commit, not
      only the last one.
    readme_anchor: Verification in CI
    evidence: "tests/test_ci_workflow_contract.py::test_backstop_checkout_has_full_history"
    status: active

  - id: ci-backstop-runs-guard-without-corpus
    claim: >-
      The `confidentiality-backstop` job runs
      `scripts/confidentiality_guard.py` with the --no-corpus flag over every
      tracked file, because the corpus layer has no access to the local
      standards directory in CI.
    readme_anchor: Verification in CI
    evidence: "tests/test_ci_workflow_contract.py::test_backstop_runs_confidentiality_guard_without_corpus"
    status: active

  - id: ci-backstop-checks-empty-history-for-local-corpus
    claim: >-
      The `confidentiality-backstop` job checks that the standards/.local
      directory never reached the repository history (`git log --all --
      standards/.local`), and fails when the result is not empty.
    readme_anchor: Verification in CI
    evidence: "tests/test_ci_workflow_contract.py::test_backstop_checks_empty_history_for_local_corpus_path"
    status: active

  - id: ci-backstop-runs-history-audit-scan
    claim: >-
      The `confidentiality-backstop` job carries a third step: an audit of
      three surfaces of the entire repository history (tree content, commit
      messages, file names) with the same identity layer patterns as the
      current gate, run with the slow marker explicitly enabled.
    readme_anchor: Verification in CI
    evidence: "tests/test_ci_workflow_contract.py::test_backstop_runs_history_audit_scan_with_slow_marker_enabled"
    status: active

  - id: history-audit-scan-skipped-by-default-locally
    claim: >-
      The scan of three surfaces of the entire history is skipped locally by
      default (the slow marker is filtered in the test suite's default
      options) and run explicitly in CI only.
    readme_anchor: Verification in CI
    evidence: manual
    reason: >-
      A claim about the behaviour of the default pytest collection,
      confirmed by measuring the number of collected tests (with default
      options and with an explicit override) recorded in the SUMMARY of plan
      05-04, not by a separate test in the suite - a test repeating that
      measurement would have to spawn its own pytest subprocess on every run,
      which is exactly the cost the marker exists to avoid.
    status: active

  - id: ci-does-not-see-identity-local-literal-file
    claim: >-
      The file of local literals for the identity layer is gitignored and
      never reaches CI - its absence is reported as a warning and the fifth
      rule stays inactive, exactly as the standards/.local corpus does for
      the corpus layer.
    readme_anchor: Verification in CI
    evidence: "tests/test_confidentiality_guard.py::test_load_identity_local_literals_missing_file_warns_and_returns_empty"
    status: active

  # --- ## License --------------------------------------------------------------

  - id: license-content-is-apache-2-0
    claim: >-
      The LICENSE file carries the canonical text of the Apache License 2.0,
      with exactly one line differing from the canonical text (the copyright
      line), proven by comparing the sha256 digest after substituting the
      template line back.
    readme_anchor: License
    evidence: "tests/test_license.py::test_license_with_placeholder_restored_matches_canonical_sha256"
    status: active

# Second-level README headers that deliberately make NO claim about the code
# (the header carries a command or a reference, not an assertion about the
# tool's behaviour), so the catalogue above does not cover them. Every entry
# carries a non-empty `reason`, checked by machine (D-16, third point). This
# list is NOT a place for claims without evidence: a header for which evidence
# could be written does not stand here.
excluded_anchors:
  - anchor: What a finding looks like
    reason: >-
      The header carries a quotation from an artifact already covered by the
      example report entry (`example-report-reproducible-from-slice`) - the
      block shown there is a fragment of the very file that entry's test
      compares byte for byte, so a separate claim would duplicate the same
      evidence under a second identifier.
  - anchor: Tests
    reason: >-
      The header carries the command to run the test suite (`uv run pytest`),
      not an assertion about the tool's behaviour - there is no claim to
      cover with evidence.
