[project]
name = "wayside"
version = "0.1.0"
description = "Pasywne narzedzie do oceny bezpieczenstwa sieci OT/ICS na podstawie zrzutow pcap"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.7.0",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.8",
]

[project.scripts]
wayside = "wayside.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "syrupy>=6.0.0",
    "pre-commit>=4.6.2",
    "pypdf>=6.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# UWAGA (D-22, Pitfall 1 badania fazy 5): rejestracja znacznika "slow" w liscie
# `markers` ponizej NIE POMIJA zadnego testu - odpowiada wylacznie za walidacje
# nazwy znacznika i wyciszenie ostrzezenia "unknown marker". Faktyczne pominiecie
# robi WYLACZNIE filtr `-m 'not slow'` w `addopts` ponizej - to jest druga, rownie
# konieczna polowa tego samego rozstrzygniecia; sama rejestracja bez tego filtra
# zostawia znacznik zarejestrowany, ale nieskuteczny.
addopts = "-q -m 'not slow'"
markers = [
    "integration: testy integracyjne (m.in. prawdziwy subprocess git)",
    "slow: skan pelnej historii repozytorium (trzy powierzchnie razy caly zbior commitow) - pomijany domyslnie lokalnie, wlaczany jawnie wylacznie w jobie CI confidentiality-backstop",
]
