[project]
name = "wayside"
version = "0.1.0"
description = "Passive OT/ICS network security assessment tool driven by pcap captures"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.7.0",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.8",
]

[project.scripts]
wayside = "wayside.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "syrupy>=6.0.0",
    "pre-commit>=4.6.2",
    "pypdf>=6.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE (D-22, Pitfall 1 of the phase 5 research): registering the "slow" marker
# in the `markers` list below SKIPS NOTHING - it only validates the marker name
# and silences the "unknown marker" warning. The actual skipping is done SOLELY
# by the `-m 'not slow'` filter in `addopts` below - that is the second, equally
# necessary half of the same decision; registration without that filter leaves
# the marker registered but ineffective.
addopts = "-q -m 'not slow'"
markers = [
    "integration: integration tests (among others a real git subprocess)",
    "slow: a scan of the full repository history (three surfaces times the whole set of commits) - skipped by default locally, enabled explicitly only in the confidentiality-backstop CI job",
]
