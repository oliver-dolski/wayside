[project]
name = "wayside"
version = "0.1.0"
description = "Pasywne narzedzie do oceny bezpieczenstwa sieci OT/ICS na podstawie zrzutow pcap"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.7.0",
    "typer>=0.27.2",
    "pyyaml>=6.0.3",
    "fpdf2>=2.8.8",
]

[project.scripts]
wayside = "wayside.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "syrupy>=6.0.0",
    "pre-commit>=4.6.2",
    "pypdf>=6.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: testy integracyjne (m.in. prawdziwy subprocess git)",
]
