id: cleartext-protocol
title: "Presence of a cleartext protocol in the observed communication"
applies_to:
  protocol: ["telnet", "ftp", "http"]
severity: medium
rationale: >-
  A protocol without transmission encryption exposes the content of the
  session, credentials included, to anyone who can see this network segment.
  This is our own analysis of an observed property of the traffic, not a
  judgement on the work of the installation operator - older industrial
  installations often have no alternative available.
standards:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 4.1"
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "undetermined-2"
evaluator: "cleartext_protocol:evaluate"
remediation: >-
  Move management of this traffic onto an encrypted channel wherever the
  protocol has an encrypted variant. Where no encrypted variant exists,
  separate this traffic at the network level - for example through
  segmentation and by limiting access to that segment to the hosts that
  need it.
