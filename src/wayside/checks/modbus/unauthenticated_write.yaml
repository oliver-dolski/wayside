id: modbus-unauthenticated-write
title: "Operacja zapisu do sterownika przez Modbus/TCP bez żadnego uwierzytelnienia"
applies_to:
  protocol: modbus-tcp
severity: high
rationale: >-
  Modbus/TCP nie ma wbudowanego mechanizmu uwierzytelniania: każdy host
  widzący ten segment sieci może wysłać kod funkcji zapisu do sterownika bez
  weryfikacji tożsamości nadawcy. Własna analiza zaobserwowanego ruchu, nie
  cytat z normy.
standards:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.1"
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "nieustalony-1"
evaluator: "unauthenticated_write:evaluate"
remediation: >-
  Ograniczyć możliwość wysyłania kodów zapisu Modbus/TCP do znanych hostów
  inżynierskich na poziomie sieci, np. przez segmentację i listy kontroli
  dostępu.
