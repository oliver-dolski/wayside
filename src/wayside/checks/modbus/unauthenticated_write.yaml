id: modbus-unauthenticated-write
title: "Write operation to a controller over Modbus/TCP with no authentication at all"
applies_to:
  protocol: modbus-tcp
severity: high
rationale: >-
  Modbus/TCP has no built-in authentication mechanism: any host that can see
  this network segment may send a write function code to the controller with
  no verification of the sender's identity. This is our own analysis of
  observed traffic, not a quotation from a standard.
standards:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.1"
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "undetermined-1"
evaluator: "unauthenticated_write:evaluate"
remediation: >-
  Restrict the ability to send Modbus/TCP write codes to known engineering
  hosts at the network level, for example through segmentation and access
  control lists.
