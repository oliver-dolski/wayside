id: unauthenticated-industrial-protocol
title: "Use of an industrial protocol without an authentication mechanism in the observed communication"
applies_to:
  protocol: modbus-tcp
severity: high
rationale: >-
  This finding concerns the mere use of a protocol that has no mechanism for
  authenticating the sender, regardless of whether a write operation
  occurred in this capture. Any host that can see this network segment may
  send a command the device will execute, and a read observed in the capture
  proves only that the communication path exists and is open. This is a
  property of the protocol, not a decision or an omission of the
  installation operator - in an older industrial installation there is often
  no alternative.
standards:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.2"
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "undetermined-1"
evaluator: "unauthenticated_industrial_protocol:evaluate"
remediation: >-
  Restrict at the network level the set of hosts that may open a session to
  the controller at all, through segmentation and access control lists. The
  protocol itself cannot be authenticated without replacing devices or
  without an intermediary layer.
