id: unauthenticated-industrial-protocol
title: "Użycie protokołu przemysłowego bez mechanizmu uwierzytelnienia w zaobserwowanej komunikacji"
applies_to:
  protocol: modbus-tcp
severity: high
rationale: >-
  Finding dotyczy samego użycia protokołu, który nie ma mechanizmu
  uwierzytelnienia nadawcy, niezależnie od tego, czy w tym zrzucie doszło do
  operacji zapisu. Każdy host widzący ten segment sieci może wysłać
  polecenie, które urządzenie wykona, a odczyt zaobserwowany w zrzucie
  dowodzi wyłącznie tego, że ścieżka komunikacji istnieje i jest otwarta.
  Jest to własność protokołu, nie decyzja ani zaniedbanie operatora
  instalacji - w starszej instalacji przemysłowej alternatywy często nie ma.
standards:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.2"
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "nieustalony-1"
evaluator: "unauthenticated_industrial_protocol:evaluate"
remediation: >-
  Ograniczyć na poziomie sieci grono hostów, które mogą w ogóle otworzyć
  sesję do sterownika, przez segmentację i listy kontroli dostępu. Samego
  protokołu nie da się uwierzytelnić bez wymiany urządzeń albo bez warstwy
  pośredniczącej.
