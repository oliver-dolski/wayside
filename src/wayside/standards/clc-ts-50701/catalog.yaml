entries:
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "undetermined-1"
    clause_title: "Security requirements for railway signalling and control systems"
    clause_title_source: "own"
    paraphrase: >-
      The document concerns cybersecurity requirements placed on railway
      traffic control and signalling systems, including protection of their
      correct operation against deliberate and accidental compromise.
    paraphrase_note: >-
      Our own working paraphrase - never a quotation from the standard. The
      field is visible only to an auditor verifying this catalogue against a
      copy of the standard, and is not rendered in any report format.
    verified: false
    verification_note: >-
      The document has the status of a CENELEC technical specification, not
      a European standard, so it is applied voluntarily - the report does
      not present it as a mandatory basis (decision 0004). The clause
      numbering has not been collated against a copy, because the project
      does not buy that copy; the entry is provisional for that reason
      (decision 0006).
  - standard: "CLC/TS 50701"
    edition: "2023"
    clause: "undetermined-2"
    clause_title: "Protection of information confidentiality in railway system communication"
    clause_title_source: "own"
    paraphrase: >-
      The document concerns protecting the confidentiality of information
      transmitted in the communication of railway systems within its scope,
      against disclosure to unauthorised parties.
    paraphrase_note: >-
      Our own working paraphrase - never a quotation from the standard. The
      field is visible only to an auditor verifying this catalogue against a
      copy of the standard, and is not rendered in any report format.
    verified: false
    verification_note: >-
