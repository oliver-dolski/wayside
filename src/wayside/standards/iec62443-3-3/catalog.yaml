entries:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.1"
    clause_title: "Human user identification and authentication"
    clause_title_source: "own"
    paraphrase: >-
      The clause concerns ensuring that every human user connecting to the
      control system is uniquely identified and authenticated.
    paraphrase_note: >-
      Our own working paraphrase - never a quotation from the standard. The
      field is visible only to an auditor verifying this catalogue against a
      copy of the standard, and is not rendered in any report format.
    verified: false
    verification_note: >-
      The clause numbering and the paraphrase text await collation against a
      legal copy of IEC 62443-3-3 in phase 4. Until then the entry is
      provisional and does not constitute a confirmed citation.
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.2"
    clause_title: "Software process and device identification and authentication"
    clause_title_source: "own"
    paraphrase: >-
      The clause concerns ensuring that every software process and every
      device connecting to the control system is uniquely identified and
      authenticated - as distinct from human users, who are covered by a
      separate clause of this catalogue.
    paraphrase_note: >-
      Our own working paraphrase - never a quotation from the standard. The
      field is visible only to an auditor verifying this catalogue against a
      copy of the standard, and is not rendered in any report format.
    verified: false
    verification_note: >-
      The clause numbering and the paraphrase text await collation against a
      legal copy of IEC 62443-3-3 in phase 4. Until then the entry is
      provisional and does not constitute a confirmed citation.
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 4.1"
    clause_title: "Information confidentiality in communication"
    clause_title_source: "own"
    paraphrase: >-
      The clause concerns protecting the confidentiality of information
      transmitted in control system communication, credentials included,
      against disclosure to unauthorised parties.
    paraphrase_note: >-
      Our own working paraphrase - never a quotation from the standard. The
      field is visible only to an auditor verifying this catalogue against a
      copy of the standard, and is not rendered in any report format.
    verified: false
    verification_note: >-
      The clause numbering and the paraphrase text await collation against a
      legal copy of IEC 62443-3-3 in phase 4. Until then the entry is
      provisional and does not constitute a confirmed citation.
