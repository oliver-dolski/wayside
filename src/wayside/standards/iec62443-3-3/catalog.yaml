entries:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.1"
    clause_title: "Identyfikacja i uwierzytelnienie uzytkownikow ludzkich"
    paraphrase: >-
      Wlasna, robocza parafraza: punkt dotyczy zapewnienia, ze kazdy
      uzytkownik ludzki laczacy sie z systemem sterowania jest jednoznacznie
      zidentyfikowany i uwierzytelniony, zanim uzyska dostep do funkcji
      majacych wplyw na bezpieczenstwo procesu. Nigdy cytat normy.
    verified: false
    verification_note: >-
      Numeracja punktu i tresc parafrazy czekaja na zestawienie z legalnym
      egzemplarzem normy IEC 62443-3-3 w fazie 4. Do tego czasu wpis jest
      prowizoryczny i nie stanowi potwierdzonego powolania.
