entries:
  - standard: "IEC-62443-3-3"
    edition: "2013"
    clause: "SR 1.1"
    clause_title: "Identyfikacja i uwierzytelnienie użytkowników ludzkich"
    paraphrase: >-
      Własna, robocza parafraza: punkt dotyczy zapewnienia, że każdy
      użytkownik ludzki łączący się z systemem sterowania jest jednoznacznie
      zidentyfikowany i uwierzytelniony, zanim uzyska dostęp do funkcji
      mających wpływ na bezpieczeństwo procesu. Nigdy cytat normy.
    verified: false
    verification_note: >-
      Numeracja punktu i tresc parafrazy czekaja na zestawienie z legalnym
      egzemplarzem normy IEC 62443-3-3 w fazie 4. Do tego czasu wpis jest
      prowizoryczny i nie stanowi potwierdzonego powolania.
