    license: "CC0 - own data, synthetic"
    description: >-
      A deliberately damaged file: the same write as the base fixture,
      written without its last ten bytes, so that the file ends in the middle
      of the last record. The global magic stays valid - this is the fixture
      for truncation detected structurally, not by packet count.
    protocol: modbus-tcp
  - path: empty_valid_header.pcap
    sha256: "704e5e5b3234433c01fcfd1b20a306e77e985038120492dc53965c3edd38a4ea"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_empty_valid_header
    license: "CC0 - own data, synthetic"
    description: >-
      A file containing only the twenty-four byte global header of classic
      pcap, zero records. Structurally valid and legally empty (D-01) - it is
      not a damaged file.
    protocol: none
  - path: modbus_write_single_register.pcapng
