    generator: scripts/gen_fixtures.py::gen_modbus_write_pcapng
    license: "CC0 - own data, synthetic"
    description: >-
      The same 0x06 write exchange as the classic fixture, written in the
      pcapng format instead of classic pcap - proof that both formats named
      in INGEST-01 pass through the whole pipeline.
    protocol: modbus-tcp
  - path: truncated_mid_block.pcapng
    sha256: "e1125f13a297f8290142482f58ce39a6edbf07758ae8a0bb42cd9bf2678a3fd3"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_truncated_mid_block
    license: "CC0 - own data, synthetic"
    description: >-
      A deliberately damaged file: the same write as the base pcapng
      fixture, written without its last ten bytes, so that the file ends in
      the middle of the last Enhanced Packet Block. The pcapng counterpart of
      truncated_mid_record.pcap.
    protocol: modbus-tcp
  - path: snaplen_truncated_frames.pcap
    sha256: "271437a3e1e48e1cf6dc86541f9a5087f5a2a11a789aa1097cda80fd3d8f125d"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_snaplen_truncated_frames
    license: "CC0 - own data, synthetic"
    description: >-
      Modbus/TCP write function code 0x06, a global header with a snaplen of
      54 bytes, two records truncated by the snaplen - the captured length
      equals exactly the full layer two to four headers, the original length
      is greater. A legal case: the structural audit accepts it and reports
      no truncation. Addressing from the RFC 5737 documentation range,
      locally administered MAC addresses.
    protocol: modbus-tcp
  - path: corrupted_record_length.pcap
    sha256: "86a03bec25773cb507470e02ac19bc0a0f7720b2da3413f3311c6ca772cfe821"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_corrupted_record_length
    license: "CC0 - own data, synthetic"
    description: >-
      A file built from the same bytes as the base fixture, with the
      captured length field of the first record patched in place to a value
      greater than the snaplen. The file length stays identical to the source
      length - the structure is inconsistent, the file is not truncated.
      Distinct from the snaplen truncation fixture: this is corruption of a
      length field, not legal truncation.
    protocol: modbus-tcp
  - path: modbus_poll_cycle_short_window.pcap
    sha256: "0fecc748a3e504487a9bc8b3fdb1a0f04a14cbecb872ba68a0303cd9ae45edfa"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_poll_cycle_short_window
    license: "CC0 - own data, synthetic"
    description: >-
      Four packets, two Modbus write function code 0x06 requests in one TCP
      session, five seconds apart. The capture window is shorter than two and
      than three full intervals between requests, so the file triggers the
      warning about a window too short against the polling cycle.
    protocol: modbus-tcp
  - path: modbus_poll_cycle_full_window.pcap
    sha256: "20963fa101af0f52a46a2042b450b21c67be23c0b589597be986fcd67e5158d0"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_poll_cycle_full_window
    license: "CC0 - own data, synthetic"
    description: >-
      Twelve packets, six Modbus write function code 0x06 requests in one
      TCP session, one second apart. The capture window spans five full
      intervals between requests - the negative case, the file triggers no
      warning about a window too short.
    protocol: modbus-tcp
  - path: modbus_gateway_multi_unit_id.pcap
    sha256: "a7033b6ab9657fa2b79a686beee0ac9478de70a9a9e2ceac5237c1509dfe64c8"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_gateway_multi_unit_id
    license: "CC0 - own data, synthetic"
    description: >-
      Six packets, three Modbus write function code 0x06 exchanges to one
      server address, with three different Unit ID values. One network host
      exposing three logical addresses behind it, not three hosts - material
      for detecting a gateway with multiple Unit IDs in the inventory.
    protocol: modbus-tcp
  - path: modbus_tcp_handshake.pcap
    sha256: "cf92ac59c0e3cdb6b68f360c1e4677b7f9d3573ec5215c9067e3da7181d6b579"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_tcp_handshake
    license: "CC0 - own data, synthetic"
    description: >-
      Five packets: a three-way TCP handshake (SYN, SYN-ACK, ACK)
      explicitly before a Modbus write function code 0x06 exchange. The first
      packet carries the SYN flag without the ACK flag - the only passive
      evidence of the session initiating party. Earlier fixtures carried no
      connection handshake.
    protocol: modbus-tcp
  - path: modbus_rtu_over_tcp.pcap
    sha256: "3858f256043cd1ad21e2528f0c71ab1ff4ec0f082255679953f38861825dce05"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_rtu_over_tcp
    license: "CC0 - own data, synthetic"
    description: >-
      Two packets in one TCP session, non-standard destination port 10502.
      The payload of each packet is a raw eight-byte Modbus RTU frame
      (address 0x01, function code 0x06 Write Single Register, register
      address 0x0001, value 0x002A, CRC16/Modbus checksum), with no MBAP
      header - a serial-to-network converter passing a frame from the bus
      straight into a TCP socket. Neither payload passes MBAP validation.
    protocol: modbus-rtu-over-tcp
  - path: cleartext_telnet_ftp_http.pcap
    sha256: "59d659b74a4abcbd63a87e1b87e28fe41c9cd5e1881f5195267030ba22839b32"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_cleartext_telnet_ftp_http
    license: "CC0 - own data, synthetic"
    description: >-
      Seven packets, three cleartext TCP sessions: Telnet on port 23 (two
      packets with a three-byte option negotiation sequence), the FTP control
      channel on port 21 (the server greeting, the user name command, the
      password command), HTTP on the non-standard port 8080 instead of 80 -
      recognition is meant to go by payload content, never by port number
      (PROTO-01 as the pattern). The user name `testuser` and the password
      `testpass123` in the FTP control channel are openly invented for the
      test and belong to no account.
    protocol: "telnet,ftp,http"
  - path: modbus_read_only_session.pcap
    sha256: "b71c5fba355bf0b29e4c14c7a833c5c4d46353c721af4fed1fabd11afed836f6"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_read_only_session
    license: "CC0 - own data, synthetic"
    description: >-
      One Modbus/TCP session, three request-response exchanges, every
      request carrying the read holding registers function code (0x03) - zero
      write operations in the whole file. The fixture exists as the case that
      separates two checks: it produces a finding for the use of an
      industrial protocol without an authentication mechanism and produces no
      finding for a write operation to a controller, so a check implemented
      as a filter on the latter would turn red here.
    protocol: modbus-tcp

# External dataset entries stand in a SEPARATE block, not on the fixture
# list above (assumption Z-70): every entry above points at a file present in
# this directory and a test enforces that (tests/test_fixture_manifest.py) -
# an external dataset file deliberately NEVER enters the repository (decision
# record `0005`), so weakening that gate would make room for an entry that
# contradicts it. This block carries its own requirement of source, licence
# and attribution, checked by tests/test_example_report.py.
