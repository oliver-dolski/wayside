fixtures:
  - path: modbus_write_single_register.pcap
    sha256: "14b0e7ee7ebb79c3b13583dc3edcb2f1fbe4c95a1c7e62e17f8a99d7a28ff4f6"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_write_single_register
    license: "CC0 - own data, synthetic"
    description: >-
      Modbus/TCP write function code 0x06 to a holding register (request and
      response), with no authentication, valid MBAP header. Addressing from
      the RFC 5737 documentation range, locally administered MAC addresses.
    protocol: modbus-tcp
  - path: modbus_write_non_standard_port.pcap
    sha256: "29759efe261f44f2afa3fee2666cc9d1f8382354dcd4fe184a68619c5a5ff0c1"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_non_standard_port
    license: "CC0 - own data, synthetic"
    description: >-
      The same 0x06 write exchange as the base fixture, but the server
      listens on port 10502 instead of 502 - proof that Modbus/TCP
      recognition goes by the shape of the MBAP header, regardless of port
      number (PROTO-01).
    protocol: modbus-tcp
  - path: modbus_malformed_mbap.pcap
    sha256: "f5e5f89d633bf3cedc329b4c552871c5209fba1a0cd943c50de7315997005d29"
    source: synthetic
    generator: scripts/gen_fixtures.py::gen_modbus_malformed_mbap
    license: "CC0 - own data, synthetic"
    description: >-
      A deliberately damaged file: two frames, each breaking a different
      MBAP validation condition. The first frame has a non-zero protocol
      identifier in bytes 2:4 of the payload. The second has a length field
      in bytes 4:6 inconsistent with the actual number of remaining bytes.
      Neither frame can pass validate_mbap.
    protocol: modbus-tcp
  - path: truncated_mid_record.pcap
    sha256: "bd669457f770d73a8ef205c96c98210573130eb8871bf1dd1c1109c867bd1f6c"
